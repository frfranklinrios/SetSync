{% if upsell_alerts %}
{% for alert in upsell_alerts %}
<div class="alert alert-{{ alert.level }} dashboard-compact-alert py-2 mb-2 small d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div>
        <strong>{{ alert.title }}</strong> — {{ alert.message }}
    </div>
    <a href="{{ alert.cta_url }}" class="btn btn-sm {% if alert.level == 'warning' %}btn-warning{% elif alert.level == 'success' %}btn-success{% else %}btn-outline-primary{% endif %}">
        {{ alert.cta_label }}
    </a>
</div>
{% endfor %}
{% endif %}
