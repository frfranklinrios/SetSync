<input type="hidden" name="billing_period" value="monthly" class="js-billing-period-input">
<div class="billing-toggle-wrap mb-2">
    <div class="btn-group btn-group-sm w-100 js-billing-toggle" role="group" aria-label="Período de cobrança">
        <button type="button" class="btn btn-outline-secondary active" data-period="monthly">Mensal</button>
        <button type="button" class="btn btn-outline-secondary" data-period="annual">
            Anual <span class="badge bg-success-subtle text-success border border-success-subtle ms-1">−2 meses</span>
        </button>
    </div>
    <p class="js-billing-hint small text-muted mb-0 mt-1" hidden></p>
</div>
