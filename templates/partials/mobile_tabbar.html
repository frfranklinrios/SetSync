{# Barra inferior mobile: as 4 ações core + "+" (adicionar música). #}
{% if current_user.is_authenticated and not pdfgen and not is_print_view %}
{% set ep = request.endpoint or '' %}
<nav class="ss-tabbar d-lg-none" aria-label="Navegação principal">
    <a href="{{ url_for('dashboard') }}" class="ss-tab{% if ep == 'dashboard' %} active{% endif %}">
        <i class="fas fa-house"></i><span>Início</span>
    </a>
    <a href="{{ url_for('cifras.my_library') }}" class="ss-tab{% if ep.startswith('cifras.') %} active{% endif %}">
        <i class="fas fa-folder-open"></i><span>Coleção</span>
    </a>
    <a href="{{ url_for('cifras.add_personal') }}" class="ss-tab ss-tab-add" aria-label="Adicionar música">
        <span class="ss-tab-add-btn"><i class="fas fa-plus"></i></span>
    </a>
    <a href="{{ url_for('bands.list_bands') }}" class="ss-tab{% if ep.startswith('bands.') %} active{% endif %}">
        <i class="fas fa-users"></i><span>Bandas</span>
    </a>
    <a href="{{ url_for('agenda.minha_agenda') }}" class="ss-tab{% if ep.startswith('agenda.') %} active{% endif %}">
        <i class="fas fa-calendar-alt"></i><span>Agenda</span>
    </a>
</nav>
<style>
@media (max-width: 991.98px) {
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    .ss-tabbar {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 1030;
        display: flex;
        align-items: stretch;
        justify-content: space-around;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-shadow: 0 -6px 24px rgba(15, 23, 42, 0.08);
    }
    [data-theme="dark"] .ss-tabbar {
        background: rgba(11, 20, 34, 0.88);
        border-top-color: rgba(51, 65, 85, 0.85);
        box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.45);
    }
    .ss-tab {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 0.45rem 0.25rem 0.4rem;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.68rem;
        font-weight: 600;
        line-height: 1;
        min-height: 58px;
        transition: color 0.14s ease;
    }
    .ss-tab i { font-size: 1.15rem; }
    .ss-tab.active { color: var(--accent); }
    .ss-tab.active::before {
        content: "";
        position: absolute;
        top: 0;
        left: 24%;
        right: 24%;
        height: 2.5px;
        border-radius: 0 0 999px 999px;
        background: var(--accent);
        box-shadow: 0 2px 10px var(--chord-highlight-ring);
    }
    .ss-tab-add { justify-content: flex-start; }
    .ss-tab-add-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px; height: 48px;
        margin-top: -16px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        box-shadow: 0 6px 16px var(--chord-highlight-ring);
        transition: transform 0.14s ease;
    }
    .ss-tab-add:active .ss-tab-add-btn { transform: scale(0.94); }
    .ss-tab-add-btn i { font-size: 1.15rem; }
}
</style>
{% endif %}
