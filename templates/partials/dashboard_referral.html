{% if show_referral_card %}
<div class="card border-success mb-3 shadow-sm">
    <div class="card-body py-3">
        <div class="fw-semibold mb-1" style="font-size: var(--text-base);">
            <i class="fas fa-gift text-success me-1"></i> Espalhe sem sair do sofá
        </div>
        <p class="text-muted small mb-2 mb-md-3">
            Um link no WhatsApp basta: a outra banda ganha <strong>3 meses Pro</strong>
            e você também. Ou mande o convite da <strong>sua</strong> banda para o ensaio.
        </p>
        <div class="d-flex flex-wrap gap-2">
            <a href="{{ url_for('assinatura_bp.voucher_indicar') }}" class="btn btn-sm btn-success">
                Gerar código e mandar no WhatsApp
            </a>
            {% if referral_members_url %}
            <a href="{{ referral_members_url }}" class="btn btn-sm btn-outline-secondary">
                Convidar minha banda
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endif %}
