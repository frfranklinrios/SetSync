{% if show_referral_card %}
<details class="planos-resumo-card">
    <summary class="fw-semibold" style="font-size: var(--text-base); cursor: pointer;">
        <i class="fas fa-gift text-success me-1"></i> Indicar outra banda (ganhe 3 meses Pro)
    </summary>
    <div class="mt-2 pt-2 border-top">
        <p class="text-muted small mb-2">
            Um link no WhatsApp basta: a outra banda ganha <strong>3 meses Pro</strong> e você também.
        </p>
        <div class="d-flex flex-wrap gap-2">
            <a href="{{ url_for('assinatura_bp.voucher_indicar') }}" class="btn btn-sm btn-success">
                Gerar código e mandar no WhatsApp
            </a>
            {% if referral_members_url %}
            <a href="{{ referral_members_url }}" class="btn btn-sm btn-outline-secondary">
                Convidar minha banda
            </a>
            {% endif %}
        </div>
    </div>
</details>
{% endif %}
