{% extends "index.html" %}
{% block title %}Recusar convite · Uníssono{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-2">Recusar convite</h2>
        <p class="mb-1"><strong>{{ event.title }}</strong> — {{ band.name if band else '' }}</p>
        <p class="text-muted mb-3" style="font-size: var(--text-sm);">{{ format_event_datetime(event.starts_at) }}</p>
        <form method="POST" action="{{ url_for('agenda.respond_guest_token', token=token) }}">
          {% include 'partials/csrf_input.html' %}
          <input type="hidden" name="action" value="decline">
          <div class="mb-3">
            <label class="form-label" style="font-size: var(--text-sm);">Motivo (opcional)</label>
            <textarea name="note" class="form-control" rows="2" maxlength="200" placeholder="Ex.: já tenho outro show"></textarea>
          </div>
          <button type="submit" class="btn btn-danger">Confirmar recusa</button>
          <a href="{{ url_for('agenda.respond_guest_token', token=token) }}" class="btn btn-outline-secondary ms-2">Voltar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
