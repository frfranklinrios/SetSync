[project]
name = "setsync"
version = "0.1.0"
description = "Gerenciador de cifras e setlists para bandas (SetSync)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "authlib>=1.3.0",
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.15.0",
    "dnspython>=2.6.0",
    "flask>=3.0.0",
    "flask-mail>=0.9.1",
    "flask-wtf>=1.2.1",
    "gunicorn>=21.2.0",
    "itsdangerous>=2.1.2",
    "librosa>=0.10.2",
    "mercadopago>=2.2.1",
    "numpy>=1.26.0",
    "playwright>=1.60.0",
    "psycopg2-binary>=2.9.9",
    "pychord>=1.4.0",
    "python-dotenv>=1.0.0",
    "pywebpush>=2.0.0",
    "qrcode[pil]>=7.4.2",
    "redis>=5.0.0",
    "requests>=2.32.2",
    "sentry-sdk[flask]>=2.0.0",
    "soundfile>=0.12.1",
    "weasyprint>=62.0",
    "werkzeug>=3.0.1",
    "wtforms>=3.1.2",
    "yt-dlp[default]>=2026.3.17",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
