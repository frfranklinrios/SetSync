<!doctype html>
<html lang="pt-BR" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1422" />
    <meta name="description" content="Loja Uníssono — acessórios para músicos: palhetas, cabos, pedais, correias, encordoamentos e mais." />
    <title>Loja Uníssono</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var K = "setsync-theme";
        var t = "dark";
        try {
          var saved = localStorage.getItem(K);
          var cookie = (document.cookie.match(/(?:^|; )setsync-theme=(dark|light)/) || [])[1];
          t = saved === "light" || saved === "dark" ? saved : (cookie || "dark");
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.classList.toggle("dark", t === "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "dark" ? "#0b1422" : "#f3f4f6");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
